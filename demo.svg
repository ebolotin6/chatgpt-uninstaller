<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="Animated demo: the uninstaller previews and removes ChatGPT">
  <style>
    .win { fill: #1e1f29; }
    .bar { fill: #2c2e3b; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #d8dbe8; }
    .dim { fill: #8a8fa6; }
    .h { fill: #6fd3e8; font-weight: 700; }
    .ok { fill: #7ee08a; font-weight: 700; }
    .prompt { fill: #c7a6ff; }
    .l0 { opacity: 0; animation: k0 14s infinite; }
    @keyframes k0 { 0%, 10.7% { opacity: 0 } 12.2%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l1 { opacity: 0; animation: k1 14s infinite; }
    @keyframes k1 { 0%, 16.4% { opacity: 0 } 17.9%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l2 { opacity: 0; animation: k2 14s infinite; }
    @keyframes k2 { 0%, 20.7% { opacity: 0 } 22.2%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l3 { opacity: 0; animation: k3 14s infinite; }
    @keyframes k3 { 0%, 25.7% { opacity: 0 } 27.2%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l4 { opacity: 0; animation: k4 14s infinite; }
    @keyframes k4 { 0%, 30.0% { opacity: 0 } 31.5%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l5 { opacity: 0; animation: k5 14s infinite; }
    @keyframes k5 { 0%, 35.0% { opacity: 0 } 36.5%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l6 { opacity: 0; animation: k6 14s infinite; }
    @keyframes k6 { 0%, 39.3% { opacity: 0 } 40.8%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l7 { opacity: 0; animation: k7 14s infinite; }
    @keyframes k7 { 0%, 44.3% { opacity: 0 } 45.8%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l8 { opacity: 0; animation: k8 14s infinite; }
    @keyframes k8 { 0%, 47.1% { opacity: 0 } 48.6%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l9 { opacity: 0; animation: k9 14s infinite; }
    @keyframes k9 { 0%, 64.3% { opacity: 0 } 65.8%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .l10 { opacity: 0; animation: k10 14s infinite; }
    @keyframes k10 { 0%, 72.9% { opacity: 0 } 74.4%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    .type { animation: type 14s steps(32) infinite; }
    @keyframes type { 0% { width: 0 } 10%, 97% { width: 330px } 100% { width: 0 } }
    .fill { animation: fill 14s infinite; }
    @keyframes fill { 0%, 48% { width: 0 } 62% { width: 240px } 100% { width: 240px } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
  <rect class="win" width="760" height="430" rx="12"/>
  <rect class="bar" width="760" height="34" rx="12"/>
  <rect class="bar" y="20" width="760" height="14"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
  <text x="380" y="22" text-anchor="middle" class="dim">Terminal</text>

  <defs><clipPath id="c"><rect class="type" x="44" y="50" width="0" height="24"/></clipPath></defs>
  <text x="20" y="66" class="prompt">$</text>
  <text x="44" y="66" clip-path="url(#c)">./remove-chatgpt.sh --yes</text>

  <g class="l0"><text x="20" y="100"><tspan font-weight="700">ChatGPT uninstaller</tspan><tspan class="dim"> — removing</tspan></text></g>
  <g class="l1"><text x="20" y="132" class="h">▸ Running ChatGPT processes</text></g>
  <g class="l2"><text x="36" y="154"><tspan class="dim">•</tspan> stop /Applications/ChatGPT.app/Contents/MacOS/ChatGPT</text></g>
  <g class="l3"><text x="20" y="186" class="h">▸ Browser data (history, cookies, logins, site data)</text></g>
  <g class="l4"><text x="36" y="208" class="dim">Chrome · Firefox · Safari ✓</text></g>
  <g class="l5"><text x="20" y="240" class="h">▸ Keychain · Dock · Settings</text></g>
  <g class="l6"><text x="36" y="262"><tspan class="dim">•</tspan> remove Dock icon: ChatGPT</text></g>
  <g class="l7"><text x="20" y="294" class="h">▸ App, chats, memory, caches and other files</text></g>
  <g class="l8">
    <text x="36" y="318">[</text>
    <rect x="48" y="306" width="240" height="14" fill="#3a3d4f"/>
    <rect class="fill" x="48" y="306" width="0" height="14" fill="#7ee08a"/>
    <text x="294" y="318">]</text>
  </g>
  <g class="l9"><text x="20" y="350" class="h">▸ System files (needs your Mac password)</text></g>
  <g class="l10"><text x="20" y="390" class="ok">✔ ChatGPT is gone.</text><rect class="cursor" x="170" y="377" width="9" height="17" fill="#d8dbe8"/></g>
</svg>
